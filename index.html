<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain</title>
<style>
  :root {
    --bg:#fbfbfa; --card:#fff; --ink:#1a1a19; --dim:#6f6f68; --line:#e5e5e0;
    --accent:#3b5bdb; --warn:#a8620a; --warn-bg:#fdf6ec; --ok:#2b7a4b;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#141416; --card:#1c1c1f; --ink:#e9e9e5; --dim:#98988f;
            --line:#2d2d32; --accent:#8098f5; --warn:#e0a458; --warn-bg:#2a2119;
            --ok:#6dbd8a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
         font-size:15px; line-height:1.55; }
  .wrap { max-width:820px; margin:0 auto; padding:28px 20px 100px; }
  a { color:var(--accent); }
  h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
  h2 { font-size:15px; margin:0 0 10px; letter-spacing:.04em; text-transform:uppercase;
       color:var(--dim); font-weight:600; }
  .dim { color:var(--dim); }
  .row { display:flex; gap:10px; align-items:center; }
  .head { display:flex; gap:12px; align-items:baseline; margin-bottom:22px; flex-wrap:wrap; }
  .head .sp { margin-left:auto; }

  textarea, input[type=text] {
    width:100%; font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:11px 13px;
  }
  textarea { resize:vertical; min-height:96px; line-height:1.5; }
  textarea:focus, input:focus { outline:2px solid var(--accent); outline-offset:-1px;
                                border-color:transparent; }
  ::placeholder { color:var(--dim); }
  button {
    font:inherit; font-size:14px; padding:8px 15px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button.go { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.go:hover:not(:disabled) { color:#fff; filter:brightness(1.08); }
  button.link { background:none; border:none; padding:2px 6px; color:var(--dim); font-size:13px; }
  button.link:hover { color:var(--accent); }
  button.danger:hover { color:var(--warn); border-color:var(--warn); }
  kbd { font-family:var(--mono); font-size:11px; border:1px solid var(--line);
        border-bottom-width:2px; border-radius:4px; padding:1px 5px; color:var(--dim); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:11px;
          padding:16px 18px; margin-bottom:14px; }
  .sec { margin:30px 0 0; }

  /* project list */
  .plist { display:grid; gap:10px; }
  .pcard { display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
           background:var(--card); border:1px solid var(--line); border-radius:11px;
           padding:14px 18px; transition:border-color .12s, transform .12s; }
  .pcard:hover { border-color:var(--accent); transform:translateY(-1px); }
  .pcard b { font-size:16px; font-weight:600; }
  .pcard .meta { margin-left:auto; text-align:right; color:var(--dim); font-size:13px;
                 white-space:nowrap; }

  /* updates */
  .upd { border-left:2px solid var(--line); padding:2px 0 2px 14px; margin-bottom:18px; }
  .upd .when { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums;
               display:flex; align-items:center; gap:8px; }
  .upd .when button { visibility:hidden; }
  .upd:hover .when button { visibility:visible; }
  .upd .body { white-space:pre-wrap; word-wrap:break-word; margin-top:3px; }

  /* claude output */
  .md > :first-child { margin-top:0; }
  .md > :last-child { margin-bottom:0; }
  .md p { margin:0 0 10px; }
  .md h4 { margin:16px 0 6px; font-size:13px; letter-spacing:.04em;
           text-transform:uppercase; color:var(--dim); }
  .md ul { margin:0 0 10px; padding-left:20px; }
  .md li { margin:3px 0; }
  .md code { font-family:var(--mono); font-size:12.5px; background:var(--bg);
             border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
  .md blockquote { margin:0 0 10px; padding-left:12px; border-left:2px solid var(--line);
                   color:var(--dim); }
  .md strong { font-weight:650; }

  .stale { background:var(--warn-bg); color:var(--warn); border-radius:6px;
           padding:1px 8px; font-size:12px; font-weight:600; }
  .qa { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .qa .q { font-weight:600; display:flex; gap:8px; align-items:flex-start; }
  .qa .q button { visibility:hidden; margin-left:auto; }
  .qa:hover .q button { visibility:visible; }
  .qa .when { color:var(--dim); font-size:12px; margin-top:8px; }

  .empty { color:var(--dim); padding:22px 0; }
  .err { color:var(--warn); }
  .spin::after {
    content:""; display:inline-block; width:11px; height:11px; margin-left:8px;
    vertical-align:-1px; border:2px solid currentColor; border-right-color:transparent;
    border-radius:50%; animation:sp .7s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }
  #toast {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(90px);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:9px;
    font-size:14px; max-width:80vw; transition:transform .18s; z-index:9;
  }
  #toast.on { transform:translateX(-50%) translateY(0); }
  #toast.warn { background:var(--warn); color:#fff; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const app = $("#app");

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-Brain-Token": TOKEN,
               ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}

let toastTimer;
function toast(msg, warn) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "on" + (warn ? " warn" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), warn ? 5200 : 2200);
}

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* Claude is asked for markdown, so the page renders the subset the prompts
   actually ask for: headings, bullets, bold, inline code, quotes. Everything
   is escaped BEFORE any tag is introduced — Claude's output is text we are
   displaying, and it is quoting your updates back at you. */
function md(src) {
  const inline = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = [];
  let list = null, para = [];
  const flushP = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushL = () => { if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; } };
  for (const raw of String(src ?? "").split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushP(); flushL(); continue; }
    if ((m = line.match(/^#{1,6}\s+(.*)$/))) {
      flushP(); flushL(); out.push(`<h4>${inline(m[1])}</h4>`);
    } else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      flushP(); (list = list || []).push(`<li>${inline(m[1])}</li>`);
    } else if ((m = line.match(/^>\s?(.*)$/))) {
      flushP(); flushL(); out.push(`<blockquote>${inline(m[1])}</blockquote>`);
    } else {
      flushL(); para.push(line.trim());
    }
  }
  flushP(); flushL();
  return out.join("");
}

const when = iso => {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const day = d.toLocaleDateString(undefined, { month: "short", day: "numeric",
    year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
  return `${day}, ${d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}`;
};
const ago = iso => {
  if (!iso) return "no updates yet";
  const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
  return days <= 0 ? "today" : days === 1 ? "yesterday"
       : days < 30 ? `${days} days ago` : `${Math.floor(days / 30)} months ago`;
};

/* Run an async action with the button showing it is working. Every Claude call
   goes through here: they take 5-20 seconds and a dead-looking button is the
   fastest way to make someone click it twice. */
async function busy(btn, label, fn) {
  const was = btn.textContent;
  btn.disabled = true; btn.textContent = label; btn.classList.add("spin");
  try { return await fn(); }
  catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = was; btn.classList.remove("spin"); }
}

/* ------------------------------------------------------------- home ----- */
async function home() {
  const { projects } = await api("/api/projects");
  app.innerHTML = `
    <div class="head"><h1>Brain</h1>
      <span class="dim">${projects.length} project${projects.length === 1 ? "" : "s"}</span>
    </div>
    <div class="card row">
      <input type="text" id="newname" placeholder="New project name" maxlength="120" autocomplete="off">
      <button class="go" id="newbtn">Add</button>
    </div>
    ${projects.length ? `<div class="plist">` + projects.map(p => `
      <a class="pcard" href="#/p/${p.id}">
        <b>${esc(p.name)}</b>
        <span class="meta">${p.updates} update${p.updates === 1 ? "" : "s"}<br>
          <span class="dim">${esc(ago(p.last_update_at))}</span></span>
      </a>`).join("") + `</div>`
      : `<div class="empty">No projects yet. Name one above — then keep dropping
         raw updates into it, and ask Claude what they add up to.</div>`}`;

  const add = async () => {
    const name = $("#newname").value.trim();
    if (!name) return $("#newname").focus();
    await busy($("#newbtn"), "Adding", async () => {
      const p = await api("/api/project/new", { name });
      location.hash = `#/p/${p.id}`;
    });
  };
  $("#newbtn").onclick = add;
  $("#newname").onkeydown = e => { if (e.key === "Enter") add(); };
  $("#newname").focus();
}

/* ---------------------------------------------------------- project ----- */
async function projectPage(id) {
  const p = await api(`/api/project?id=${encodeURIComponent(id)}`);
  const s = p.summary;

  app.innerHTML = `
    <div class="head">
      <a href="#/" class="dim" style="text-decoration:none">← all projects</a>
      <span class="sp"></span>
      <button class="link" id="rename">rename</button>
      <button class="link danger" id="delproj">delete project</button>
    </div>
    <h1 id="pname">${esc(p.name)}</h1>
    <div class="dim" style="margin:2px 0 22px">
      ${p.updates.length} update${p.updates.length === 1 ? "" : "s"} ·
      last ${esc(ago(p.updates[0]?.created_at))}</div>

    <div class="card">
      <textarea id="body" placeholder="What happened? Paste notes, type a line, anything — it is stored exactly as you write it."></textarea>
      <div class="row" style="margin-top:10px">
        <button class="go" id="addupd">Add update</button>
        <span class="dim" style="font-size:13px"><kbd>⌘</kbd>+<kbd>↵</kbd></span>
      </div>
    </div>

    <div class="sec">
      <h2>Summary</h2>
      <div class="card">
        <div class="row" style="margin-bottom:${s ? "12px" : "0"}">
          <button id="sumbtn">${s ? "Refresh" : "Summarise with Claude"}</button>
          ${s && s.stale ? `<span class="stale">${s.behind} new update${s.behind === 1 ? "" : "s"} since this</span>` : ""}
          ${s ? `<span class="dim" style="margin-left:auto;font-size:13px">${esc(when(s.created_at))}</span>` : ""}
        </div>
        <div class="md" id="sumbody">${s ? md(s.body)
          : `<span class="dim">Nothing yet. Claude will read every update on this
             project and write a brief.</span>`}</div>
      </div>
    </div>

    <div class="sec">
      <h2>Ask</h2>
      <div class="card">
        <div class="row">
          <input type="text" id="q" placeholder="Why did we push the date? Who owns the migration?" autocomplete="off">
          <button id="askbtn">Ask</button>
        </div>
        <div id="answers">${p.answers.map(a => `
          <div class="qa" data-a="${a.id}">
            <div class="q">${esc(a.question)}
              <button class="link danger" data-delans="${a.id}">remove</button></div>
            <div class="md" style="margin-top:8px">${md(a.answer)}</div>
            <div class="when">${esc(when(a.created_at))}</div>
          </div>`).join("")}</div>
      </div>
    </div>

    <div class="sec">
      <h2>Updates</h2>
      ${p.updates.length ? p.updates.map(u => `
        <div class="upd">
          <div class="when">${esc(when(u.created_at))}
            <button class="link danger" data-delupd="${u.id}">delete</button></div>
          <div class="body">${esc(u.body)}</div>
        </div>`).join("")
        : `<div class="empty">No updates yet. The box at the top is the whole
           input to this thing.</div>`}
    </div>`;

  // ---- add an update
  const post = async () => {
    const body = $("#body").value.trim();
    if (!body) return $("#body").focus();
    await busy($("#addupd"), "Saving", async () => {
      await api("/api/update", { project_id: p.id, body });
      $("#body").value = "";
      toast("Saved");
      await route();          // re-read rather than patch: one source of truth
    });
  };
  $("#addupd").onclick = post;
  $("#body").onkeydown = e => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); post(); }
  };

  // ---- summarise / refresh
  $("#sumbtn").onclick = e => busy(e.target, "Reading updates", async () => {
    const r = await api("/api/summarize", { project_id: p.id });
    await route();
    toast("Summary updated");
    return r;
  });

  // ---- ask
  const ask = async () => {
    const question = $("#q").value.trim();
    if (!question) return $("#q").focus();
    await busy($("#askbtn"), "Thinking", async () => {
      await api("/api/ask", { project_id: p.id, question });
      $("#q").value = "";
      await route();
    });
  };
  $("#askbtn").onclick = ask;
  $("#q").onkeydown = e => { if (e.key === "Enter") ask(); };

  // ---- rename / delete
  $("#rename").onclick = async () => {
    const name = prompt("Rename project", p.name);
    if (!name || name.trim() === p.name) return;
    try { await api("/api/project/rename", { id: p.id, name }); await route(); }
    catch (e) { toast(e.message, true); }
  };
  $("#delproj").onclick = async () => {
    // The updates go with it and there is no undo, so the name has to be typed.
    const typed = prompt(
      `Delete "${p.name}" and all ${p.updates.length} of its updates?\n` +
      `This cannot be undone. Type the project name to confirm.`);
    if (typed !== p.name) return typed !== null && toast("Name did not match — nothing deleted", true);
    try {
      await api("/api/project/delete", { id: p.id });
      location.hash = "#/";
      toast("Deleted");
    } catch (e) { toast(e.message, true); }
  };

  app.onclick = async e => {
    const u = e.target.closest("[data-delupd]");
    const a = e.target.closest("[data-delans]");
    try {
      if (u) { await api("/api/update/delete", { id: +u.dataset.delupd }); await route(); }
      else if (a) { await api("/api/answer/delete", { id: +a.dataset.delans }); await route(); }
    } catch (err) { toast(err.message, true); }
  };
}

/* ----------------------------------------------------------- routing ---- */
async function route() {
  app.onclick = null;
  const m = location.hash.match(/^#\/p\/(\d+)/);
  try {
    if (m) { await projectPage(m[1]); document.title = "Brain"; }
    else await home();
  } catch (e) {
    app.innerHTML = `<div class="head"><a href="#/" class="dim"
      style="text-decoration:none">← all projects</a></div>
      <div class="empty err">${esc(e.message)}</div>`;
  }
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
