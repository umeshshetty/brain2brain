<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain</title>
<style>
  :root {
    --bg:#fbfbfa; --card:#fff; --ink:#1a1a19; --dim:#6f6f68; --line:#e5e5e0;
    --accent:#3b5bdb; --warn:#a8620a; --warn-bg:#fdf6ec; --ok:#2b7a4b;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#141416; --card:#1c1c1f; --ink:#e9e9e5; --dim:#98988f;
            --line:#2d2d32; --accent:#8098f5; --warn:#e0a458; --warn-bg:#2a2119;
            --ok:#6dbd8a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
         font-size:15px; line-height:1.55; }
  .wrap { max-width:820px; margin:0 auto; padding:28px 20px 100px; }
  a { color:var(--accent); }
  h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
  h2 { font-size:15px; margin:0 0 10px; letter-spacing:.04em; text-transform:uppercase;
       color:var(--dim); font-weight:600; }
  .dim { color:var(--dim); }
  .row { display:flex; gap:10px; align-items:center; }
  .head { display:flex; gap:12px; align-items:baseline; margin-bottom:22px; flex-wrap:wrap; }
  .head .sp { margin-left:auto; }

  textarea, input[type=text] {
    width:100%; font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:11px 13px;
  }
  textarea { resize:vertical; min-height:96px; line-height:1.5; }
  textarea:focus, input:focus { outline:2px solid var(--accent); outline-offset:-1px;
                                border-color:transparent; }
  ::placeholder { color:var(--dim); }
  button {
    font:inherit; font-size:14px; padding:8px 15px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button.go { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.go:hover:not(:disabled) { color:#fff; filter:brightness(1.08); }
  button.link { background:none; border:none; padding:2px 6px; color:var(--dim); font-size:13px; }
  button.link:hover { color:var(--accent); }
  button.danger:hover { color:var(--warn); border-color:var(--warn); }
  kbd { font-family:var(--mono); font-size:11px; border:1px solid var(--line);
        border-bottom-width:2px; border-radius:4px; padding:1px 5px; color:var(--dim); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:11px;
          padding:16px 18px; margin-bottom:14px; }
  .sec { margin:30px 0 0; }
  /* Standing context, not a brief — flat and quiet, so it does not compete
     with the cards below that actually change. */
  .about { border:1px solid var(--line); border-radius:11px; padding:12px 14px;
           margin:0 0 16px; }
  .about.empty { border-style:dashed; }
  .about.open { border-color:var(--accent); }
  .about h3 { margin:0; font-size:12px; letter-spacing:.06em;
              text-transform:uppercase; color:var(--dim); font-weight:600; }
  .about .abody { margin-top:8px; font-size:14px; line-height:1.55; }
  .about .dim { margin-top:6px; display:block; font-size:13px; line-height:1.5; }
  .about textarea { margin-top:7px; }
  /* An instruction, not context — set apart so the difference is visible. */
  .about .wants { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .about .wants .abody { color:var(--dim); }

  /* Two panes on the home view only: what needs attention on the left,
     projects on the right. A project page goes back to one column — you are
     inside one thing there, and a cross-project pane is just something else
     to read. Below 900px the panes stack, Now first. */
  .wrap.two { max-width:1180px; display:grid; gap:32px;
              grid-template-columns:352px minmax(0,1fr); align-items:start; }
  @media (max-width:900px) { .wrap.two { grid-template-columns:1fr; gap:24px; } }

  /* the Now pane */
  .now { position:sticky; top:28px; }
  @media (max-width:900px) { .now { position:static; } }
  .now .head { margin-bottom:12px; }
  .now h1 { font-size:15px; letter-spacing:.04em; text-transform:uppercase;
            color:var(--dim); font-weight:600; }
  .grp { display:flex; align-items:center; gap:8px; margin:18px 0 8px; }
  .grp:first-of-type { margin-top:4px; }
  .grp .lbl { font-size:11px; font-weight:700; letter-spacing:.07em;
              text-transform:uppercase; color:var(--dim); }
  .grp .rule { flex:1; height:1px; background:var(--line); }
  .grp.overdue .lbl, .grp.today .lbl { color:var(--warn); }
  .grp.today .lbl { color:var(--accent); }
  /* Below the fold of urgency: still there, visibly quieter. */
  .grp.insight .lbl { color:var(--dim); }
  button.more { display:block; width:100%; margin-top:12px; padding:7px;
                border:1px dashed var(--line); border-radius:8px; font-size:12.5px; }
  .item.insight { border-left-color:var(--line); background:none; }
  .item.insight .txt { font-weight:450; }

  .item { display:block; text-decoration:none; color:inherit; background:var(--card);
          border:1px solid var(--line); border-left:3px solid var(--line);
          border-radius:9px; padding:10px 13px; margin-bottom:8px;
          transition:border-color .12s, transform .12s; }
  .item:hover { border-color:var(--accent); transform:translateX(1px); }
  .item.overdue { border-left-color:var(--warn); }
  .item.today { border-left-color:var(--accent); }
  .item .txt { font-weight:550; line-height:1.4; }
  .item .src { color:var(--dim); font-size:12px; margin-top:5px;
               display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .item .proj { color:var(--ink); background:var(--bg); border:1px solid var(--line);
                border-radius:5px; padding:0 6px; white-space:nowrap; }
  .item .q { font-style:italic; overflow:hidden; text-overflow:ellipsis;
             white-space:nowrap; max-width:100%; }
  .item .day { margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* acting on an item */
  .item.done { opacity:.55; }
  .item.done .txt { text-decoration:line-through; }
  .item .acts { display:flex; gap:4px; align-items:center; margin-top:7px;
                padding-top:7px; border-top:1px solid var(--line); }
  .item .acts button { font-size:12px; padding:2px 8px; }
  .item .acts .did { color:var(--ok); font-size:12px; margin-left:auto; }
  .act { margin-top:8px; padding-top:8px; border-top:1px solid var(--line);
         display:grid; gap:7px; }
  .act textarea { min-height:56px; font-size:14px; padding:8px 10px; }
  .act input[type=date], .act select {
    font:inherit; font-size:13px; padding:5px 8px; border-radius:7px;
    color:var(--ink); background:var(--card); border:1px solid var(--line); }
  .act .why { color:var(--dim); font-size:12px; }

  .now .foot { color:var(--dim); font-size:12px; margin-top:16px; line-height:1.5; }

  .item .proj.person { border-radius:999px; }
  .pcard .kind { color:var(--dim); font-weight:400; font-size:13px; margin-left:7px; }

  /* project list */
  .plist { display:grid; gap:10px; }
  .pcard { display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
           background:var(--card); border:1px solid var(--line); border-radius:11px;
           padding:14px 18px; transition:border-color .12s, transform .12s; }
  .pcard:hover { border-color:var(--accent); transform:translateY(-1px); }
  .pcard b { font-size:16px; font-weight:600; }
  .pcard .meta { margin-left:auto; text-align:right; color:var(--dim); font-size:13px;
                 white-space:nowrap; }

  /* topics */
  .chips { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .chips .sp { margin-left:auto; }
  .chip {
    display:inline-flex; align-items:center; gap:7px; text-decoration:none;
    font-size:13px; padding:5px 12px; border-radius:999px; color:var(--ink);
    background:var(--card); border:1px solid var(--line); white-space:nowrap;
  }
  .chip span { color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .chip.on { background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .chip.on span { color:var(--bg); opacity:.65; }
  .chip.add { color:var(--dim); border-style:dashed; cursor:pointer; font-family:inherit; }
  h2 .scope {
    text-transform:none; letter-spacing:0; font-weight:500; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:6px;
    padding:1px 8px; margin-left:6px; font-size:13px;
  }

  /* updates */
  .upd { border-left:2px solid var(--line); padding:2px 0 2px 14px; margin-bottom:18px; }
  .upd .when { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums;
               display:flex; align-items:center; gap:8px; }
  .upd .when button { visibility:hidden; }
  .upd:hover .when button { visibility:visible; }
  .upd .body { white-space:pre-wrap; word-wrap:break-word; margin-top:3px; }
  /* The filing control doubles as the label, so it is always visible — you
     should be able to see what a thing is filed under without hovering it. */
  select.filed, select#into {
    font:inherit; font-size:12px; padding:1px 4px; border-radius:5px; max-width:170px;
    color:var(--dim); background:var(--card); border:1px solid var(--line);
  }
  select.filed:hover, select#into:hover { color:var(--ink); border-color:var(--accent); }
  select#into { font-size:13px; }
  span.filed { color:var(--dim); }

  /* links between an update and other projects/people */
  .lk { display:inline-flex; align-items:center; gap:5px; font-size:12px;
        padding:1px 4px 1px 8px; border-radius:999px; color:var(--ink);
        background:var(--bg); border:1px solid var(--line); white-space:nowrap; }
  .lk.person { border-style:solid; }
  .lk b { font-weight:500; }
  .lk button { background:none; border:none; padding:0 3px; font-size:13px;
               line-height:1; color:var(--dim); cursor:pointer; }
  .lk button:hover { color:var(--warn); }
  .lks { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  select.addlk { font:inherit; font-size:12px; padding:1px 4px; border-radius:5px;
                 color:var(--dim); background:var(--card);
                 border:1px dashed var(--line); max-width:150px; }
  select.addlk:hover { color:var(--ink); border-color:var(--accent); }
  .upd.guest { border-left-style:dashed; }
  .guestof { color:var(--dim); font-size:12px; }
  .guestof b { color:var(--ink); font-weight:500; }
  .sug { color:var(--dim); font-size:12.5px; display:flex; gap:6px;
         align-items:center; flex-wrap:wrap; margin-top:9px; }
  .sug button { font-size:12px; padding:2px 9px; border-radius:999px;
                border-style:dashed; }

  /* claude output */
  .md > :first-child { margin-top:0; }
  .md > :last-child { margin-bottom:0; }
  .md p { margin:0 0 10px; }
  .md h4 { margin:16px 0 6px; font-size:13px; letter-spacing:.04em;
           text-transform:uppercase; color:var(--dim); }
  .md ul { margin:0 0 10px; padding-left:20px; }
  .md li { margin:3px 0; }
  .md code { font-family:var(--mono); font-size:12.5px; background:var(--bg);
             border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
  .md blockquote { margin:0 0 10px; padding-left:12px; border-left:2px solid var(--line);
                   color:var(--dim); }
  .md strong { font-weight:650; }

  .stale { background:var(--warn-bg); color:var(--warn); border-radius:6px;
           padding:1px 8px; font-size:12px; font-weight:600; }
  .qa { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .qa .q { font-weight:600; display:flex; gap:8px; align-items:flex-start; }
  .qa .q button { visibility:hidden; margin-left:auto; }
  .qa:hover .q button { visibility:visible; }
  .qa .when { color:var(--dim); font-size:12px; margin-top:8px; }

  .empty { color:var(--dim); padding:22px 0; }
  .err { color:var(--warn); }
  .spin::after {
    content:""; display:inline-block; width:11px; height:11px; margin-left:8px;
    vertical-align:-1px; border:2px solid currentColor; border-right-color:transparent;
    border-radius:50%; animation:sp .7s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }
  #toast {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(90px);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:9px;
    font-size:14px; max-width:80vw; transition:transform .18s; z-index:9;
  }
  #toast.on { transform:translateX(-50%) translateY(0); }
  #toast.warn { background:var(--warn); color:#fff; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const app = $("#app");

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-Brain-Token": TOKEN,
               ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}

let toastTimer;
function toast(msg, warn) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "on" + (warn ? " warn" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), warn ? 5200 : 2200);
}

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* Claude is asked for markdown, so the page renders the subset the prompts
   actually ask for: headings, bullets, bold, inline code, quotes. Everything
   is escaped BEFORE any tag is introduced — Claude's output is text we are
   displaying, and it is quoting your updates back at you. */
function md(src) {
  const inline = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = [];
  let list = null, para = [];
  const flushP = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushL = () => { if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; } };
  for (const raw of String(src ?? "").split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushP(); flushL(); continue; }
    if ((m = line.match(/^#{1,6}\s+(.*)$/))) {
      flushP(); flushL(); out.push(`<h4>${inline(m[1])}</h4>`);
    } else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      flushP(); (list = list || []).push(`<li>${inline(m[1])}</li>`);
    } else if ((m = line.match(/^>\s?(.*)$/))) {
      flushP(); flushL(); out.push(`<blockquote>${inline(m[1])}</blockquote>`);
    } else {
      flushL(); para.push(line.trim());
    }
  }
  flushP(); flushL();
  return out.join("");
}

const when = iso => {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const day = d.toLocaleDateString(undefined, { month: "short", day: "numeric",
    year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
  return `${day}, ${d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}`;
};
const ago = iso => {
  if (!iso) return "no updates yet";
  const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
  return days <= 0 ? "today" : days === 1 ? "yesterday"
       : days < 30 ? `${days} days ago` : `${Math.floor(days / 30)} months ago`;
};

/* Run an async action with the button showing it is working. Every Claude call
   goes through here: they take 5-20 seconds and a dead-looking button is the
   fastest way to make someone click it twice. */
async function busy(btn, label, fn) {
  const was = btn.textContent;
  btn.disabled = true; btn.textContent = label; btn.classList.add("spin");
  try { return await fn(); }
  catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = was; btn.classList.remove("spin"); }
}

/* Names of other projects and people that literally appear in the text. Not an
   entity resolver and not a Claude call — a substring match against names you
   created yourself, offered as a button you press or ignore. Getting this
   wrong is therefore impossible: nothing is linked until you say so. */
function mentions(text, all, selfId, already) {
  const hay = String(text || "").toLowerCase();
  return all.filter(p => p.id !== selfId && !already.includes(p.id)
    && p.name.length >= 3
    && new RegExp(`(^|[^a-z0-9])${p.name.toLowerCase()
        .replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^a-z0-9]|$)`).test(hay));
}

const lkChip = (p, uid) => `<span class="lk${p.kind === "person" ? " person" : ""}"
  ><b>${esc(p.name)}</b><button data-unlink="${uid}" data-pid="${p.id}"
    title="unlink">×</button></span>`;

/* --------------------------------------------------------------- now ----- */
/* One pane, every project. What the updates put on a day, sorted by how soon.
   Derived and cached exactly like a summary: one Claude call, thrown away and
   rebuilt whenever you ask. */

/* The pane's order, top to bottom. Dated things first because a day is the
   most urgent claim an update can make; then things someone owes with no date
   on them; then what is worth knowing but is not a task at all. An item's
   group is its `when` if it has one, otherwise its `kind`. */
const GROUPS = [
  ["overdue",   "Overdue"],
  ["today",     "Today"],
  ["this week", "This week"],
  ["later",     "Later"],
  ["todo",      "To do"],
  ["insight",   "Worth knowing"],
];
const groupOf = it => it.when || it.kind || "later";

const dayLabel = d => {
  if (!d) return "";
  const t = new Date(d + "T00:00:00"), n = new Date();
  const days = Math.round((t - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
  return days === 0 ? "today" : days === 1 ? "tomorrow" : days === -1 ? "yesterday"
       : Math.abs(days) < 7 ? (days < 0 ? `${-days} days ago` : `in ${days} days`)
       : t.toLocaleDateString(undefined, { month: "short", day: "numeric" });
};

// Which item has its form open, and which form. Kept outside the render so a
// re-render after logging does not slam it shut mid-sentence.
let openAct = null, openKind = null;
// How much of a pane is shown before it says "+N more". Capture is meant to be
// exhaustive; the pane is meant to be read in the ten seconds before a call, and
// those are not the same job. Everything is kept, the top of it is what you see.
const PANE_VISIBLE = 12;
let showAll = {};
// Links chosen for an update you have not written yet. Module-level so the
// suggestion chips can re-render the card without losing what you picked, and
// dropped the moment you walk to a different page — a link you picked while
// writing about GoBMP has no business attaching itself to the next thing you
// type somewhere else.
let pendingLinks = [], pendingFor = null;

// Who a page is to you, while you are editing it. Kept out of the DOM read so
// a rerender mid-edit does not lose what you typed.
let editAbout = false, aboutDraft = null;

/* One row of either pane.
 *
 * Acting on an item writes an update into the project it belongs to, and that
 * update is the whole record — there is no status anywhere. The item stops
 * appearing when the next pane reads a log that says it is done.
 *
 * `p` is the page the item will be logged to, or null when Claude could not
 * tie it to one — only the cross-project pane can produce that, and it makes
 * you choose rather than guessing. `chip` is false on a page's own pane: every
 * item there belongs to the page you are looking at, and stamping each row
 * with the name at the top of the screen is noise. */
function paneItem(it, i, p, all, chip = true) {
    const open = i === openAct;
    return `
    <div class="item ${groupOf(it).replace(" ", "")}${it.done ? " done" : ""}" data-item="${i}">
      <div class="txt">${p ? `<a href="#/p/${p.id}"
        style="color:inherit;text-decoration:none">${esc(it.text)}</a>` : esc(it.text)}</div>
      <div class="src">
        ${!chip ? "" : p ? `<span class="proj${p.kind === "person" ? " person" : ""}"
          >${esc(p.name)}</span>` : `<span class="proj">unplaced</span>`}
        ${it.quote ? `<span class="q">“${esc(it.quote)}”</span>` : ""}
        ${it.date ? `<span class="day">${esc(dayLabel(it.date))}</span>` : ""}
      </div>
      <div class="acts">
        ${it.done || it.kind === "insight" ? "" : `<button data-act="done" data-i="${i}">done</button>`}
        <button data-act="note" data-i="${i}">note</button>
        ${it.kind === "insight" ? "" : `<button data-act="date" data-i="${i}"
          >${it.date ? "move" : "set date"}</button>`}
        ${it.logged ? `<span class="did">logged ${it.logged === 1 ? ""
          : it.logged + "× "}to ${p ? esc(p.name) : "the log"}</span>` : ""}
      </div>
      ${open ? `
      <div class="act">
        ${openAct === i && openKind === "date" ? `<input type="date" id="actdate"
          value="${esc(it.date || "")}">` : ""}
        <textarea id="actnote" placeholder="${
          openKind === "done" ? "What did you do? (optional — it goes in the log)"
          : openKind === "date" ? "Why did it move? (optional)"
          : "What happened? This goes into the log as an update."}"></textarea>
        ${!p ? `<label class="why">Claude could not tie this to anything — log it
          under <select id="acttarget"><option value="">choose…</option>${
            all.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label>` : ""}
        <div class="row">
          <button class="go" id="actgo">${
            openKind === "done" ? "Mark done" : openKind === "date" ? "Move it" : "Log it"}</button>
          <button id="actcancel">cancel</button>
          <span class="why" style="margin-left:auto">goes into
            ${p ? esc(p.name) : "the log"} as an update</span>
        </div>
      </div>` : ""}
    </div>`;
}

/* Overdue / Today / This week / Later, in that order, empty groups dropped.
 * Indexes are positions in the whole list, because that is how the server
 * addresses an item. */
function paneGroups(items, item, which) {
  // Items arrive already ranked, so "the top of the list" is "what matters
  // most" — the cut is by position, not by group, or a long Overdue list would
  // hide every to-do behind it.
  const all = which && showAll[which];
  const shown = all ? items : items.slice(0, PANE_VISIBLE);
  const hidden = items.length - shown.length;
  const groups = GROUPS.map(([key, label]) => {
    const mine = shown.filter(i => groupOf(i) === key);
    if (!mine.length) return "";
    return `<div class="grp ${key.replace(" ", "")}">
        <span class="lbl">${label}</span><span class="rule"></span>
        <span class="lbl">${mine.length}</span></div>
      ${mine.map(i => item(i, items.indexOf(i))).join("")}`;
  }).join("");
  return groups + (hidden > 0
    ? `<button class="link more" data-more="${which}">+${hidden} more</button>`
    : all && items.length > PANE_VISIBLE
    ? `<button class="link more" data-more="${which}">show less</button>` : "");
}

function nowPane(ag, byId, all) {
  const items = ag.items || [];
  const item = (it, i) => paneItem(it, i, it.project_id ? byId[it.project_id] : null, all);
  const groups = paneGroups(items, item, "now");

  const body =
    !ag.updates ? `<div class="empty">Nothing to read yet. This pane goes
        through every project's updates and pulls out what is tied to a day —
        a cutover, a report due, a date you promised someone. Drop an update
        into a project and press <b>Read all projects</b>.</div>`
    : !ag.built ? `<div class="empty">Not built yet. Claude will read all
        ${ag.updates} update${ag.updates === 1 ? "" : "s"} across every project
        and pull out what is tied to a day.</div>`
    : items.length ? groups
    : `<div class="empty">Nothing in any project is tied to a day right now.
        Dates in your updates — “cutover Nov 3”, “update every Thursday” —
        turn up here.</div>`;

  return `
    <aside class="now">
      <div class="head">
        <h1>Now</h1>
        <span class="sp"></span>
        <button class="link" id="nowbtn">${ag.built ? "refresh" : "Read all projects"}</button>
      </div>
      ${ag.stale ? `<div class="stale" style="display:block;margin-bottom:12px">
        ${ag.behind ? `${ag.behind} new update${ag.behind === 1 ? "" : "s"} since this`
          : ag.outdated ? `Built for ${esc(ag.for_date)} — the day has turned over`
          : `The updates behind this have changed`}</div>` : ""}
      ${body}
      ${ag.built ? `<div class="foot">Read ${ag.updates}
        update${ag.updates === 1 ? "" : "s"} · built ${esc(when(ag.created_at))}
        ${ag.dropped ? `<br>Only the ${ag.per_project} most recent updates per
          project were read; ${ag.dropped} older one${ag.dropped === 1 ? "" : "s"}
          were not.` : ""}</div>` : ""}
    </aside>`;
}

/* One page's own pane.
 *
 * The same machinery as Now, over one page's updates instead of every page's.
 * It is not a filter over the cross-project pane: that one reads 40 updates a
 * project and then keeps the 12 most urgent items across the whole store, so a
 * quiet page's real deadline loses to a noisy page's routine one and you open
 * the page to find it says nothing. This reads the page. */
function pagePane(pane, p, W) {
  const items = pane.items || [];
  const which = "page";
  const item = (it, i) => paneItem(it, i, p, [], false);

  const body =
    !pane.updates ? `<div class="empty">Nothing to read yet. Drop
        ${W.unit === "note" ? "a note" : "an update"} in and press
        <b>${W.readBtn}</b> — dates in what you write
        (“cutover Nov 3”, “I said I would come back to her Friday”) turn up here.</div>`
    : !pane.built ? `<div class="empty">Not built yet. Claude will read
        ${pane.updates} ${W.unit}${pane.updates === 1 ? "" : "s"} on this page —
        ${W.guests} — and pull out what is tied to a day.</div>`
    : items.length ? paneGroups(items, item, which)
    : `<div class="empty">Nothing here is tied to a day right now.</div>`;

  return `
    <aside class="now">
      <div class="head">
        <h1>Dates</h1>
        <span class="sp"></span>
        <button class="link" id="panebtn">${pane.built ? "refresh" : W.readBtn}</button>
      </div>
      ${pane.stale ? `<div class="stale" style="display:block;margin-bottom:12px">
        ${pane.behind ? `${pane.behind} new ${W.unit}${pane.behind === 1 ? "" : "s"} since this`
          : pane.outdated ? `Built for ${esc(pane.for_date)} — the day has turned over`
          : `What this read has changed`}</div>` : ""}
      ${body}
      ${pane.built ? `<div class="foot">Read ${pane.updates}
        ${W.unit}${pane.updates === 1 ? "" : "s"} · built ${esc(when(pane.created_at))}
        ${pane.dropped ? `<br>Only the ${pane.cap} most recent were read;
          ${pane.dropped} older one${pane.dropped === 1 ? "" : "s"} were not.` : ""}</div>` : ""}
    </aside>`;
}

/* ------------------------------------------------------------- home ----- */
async function home(kind) {
  // Two reads, one round trip each way. The agenda is its own call so a slow
  // or empty pane never holds up the list. Both kinds come back together so the
  // tab you are not on can still show its count.
  const [{ projects }, ag] = await Promise.all([
    api("/api/projects"), api("/api/agenda"),
  ]);
  const byId = Object.fromEntries(projects.map(p => [p.id, p]));
  const people = kind === "person";
  const mine = projects.filter(p => (p.kind === "person") === people);
  const nProj = projects.length - projects.filter(p => p.kind === "person").length;
  const nPeep = projects.length - nProj;

  const W = people
    ? { unit: "note", head: "People", add: "Name of the person",
        empty: `No people yet. Add someone above, then drop your 1-1 notes in as
                you take them — Claude reads them back before the next one.` }
    : { unit: "update", head: "Projects", add: "New project name",
        empty: `No projects yet. Name one above — then keep dropping raw updates
                into it, and ask Claude what they add up to.` };

  app.className = "wrap two";
  const right = `
    <div>
      <div class="head"><h1>Brain</h1></div>
      <div class="chips">
        <a class="chip${people ? "" : " on"}" href="#/">Projects<span>${nProj}</span></a>
        <a class="chip${people ? " on" : ""}" href="#/people">People<span>${nPeep}</span></a>
      </div>
      <div class="card row">
        <input type="text" id="newname" placeholder="${W.add}" maxlength="120" autocomplete="off">
        <button class="go" id="newbtn">Add</button>
      </div>
      ${mine.length ? `<div class="plist">` + mine.map(p => `
        <a class="pcard" href="#/p/${p.id}">
          <b>${esc(p.name)}</b>
          <span class="meta">${p.updates} ${W.unit}${p.updates === 1 ? "" : "s"}${
            p.topics ? ` · ${p.topics} topic${p.topics === 1 ? "" : "s"}` : ""}<br>
            <span class="dim">${esc(ago(p.last_update_at))}</span></span>
        </a>`).join("") + `</div>`
        : `<div class="empty">${W.empty}</div>`}
    </div>`;
  app.innerHTML = nowPane(ag, byId, projects) + right;

  // ---- act on an item: every action writes an update, nothing sets a status
  const rerender = () => { app.innerHTML = nowPane(ag, byId, projects) + right; wire(); };

  app.onclick = async e => {
    const more = e.target.closest("[data-more]");
    if (more) { showAll[more.dataset.more] = !showAll[more.dataset.more]; return rerender(); }
    const b = e.target.closest("[data-act]");
    if (b) {
      const i = +b.dataset.i;
      // clicking the open one again closes it
      const same = openAct === i && openKind === b.dataset.act;
      openAct = same ? null : i;
      openKind = same ? null : b.dataset.act;
      return rerender();
    }
    if (e.target.id === "actcancel") { openAct = openKind = null; return rerender(); }
    if (e.target.id !== "actgo") return;

    const i = openAct, kind = openKind;
    const note = $("#actnote") ? $("#actnote").value.trim() : "";
    const date = $("#actdate") ? $("#actdate").value : "";
    const target = $("#acttarget") ? $("#acttarget").value : "";
    await busy(e.target, "Logging", async () => {
      const out = await api("/api/agenda/act", {
        built: ag.created_at, index: i, action: kind,
        note, date, project_id: target || null,
      });
      openAct = openKind = null;
      await route();
      toast(`Logged to ${out.logged_to.name}`);
    });
  };

  const add = async () => {
    const name = $("#newname").value.trim();
    if (!name) return $("#newname").focus();
    await busy($("#newbtn"), "Adding", async () => {
      const p = await api("/api/project/new", { name, kind: people ? "person" : "project" });
      location.hash = `#/p/${p.id}`;
    });
  };

  // Re-bound after every re-render of the pane: opening an item's form
  // rewrites the whole shell, and a dead Add button is worse than a slow one.
  function wire() {
    $("#newbtn").onclick = add;
    $("#newname").onkeydown = e => { if (e.key === "Enter") add(); };
    $("#nowbtn").onclick = e => busy(e.target, "Reading", async () => {
      openAct = openKind = null;
      await api("/api/agenda/refresh", {});
      await route();
      toast("Now updated");
    });
    if ($("#actnote")) $("#actnote").focus();
  }
  wire();
  if (openAct === null) $("#newname").focus();
}

/* ---------------------------------------------------------- project ----- */
/* Scope is in the URL, so a topic is a link you can keep: #/p/3, #/p/3/t/7,
   #/p/3/unfiled. "" is the whole project. */
// The two things you write about a page rather than into its log. Both are
// yours and nothing regenerates either, so they render as typed, line for
// line, and the model that can draft one stops at the textarea.
//
// They are shown together and saved together, but they are not the same kind
// of thing: `about` is context and can only change what a brief selects, while
// `wants` is an instruction to the writer. The card says which is which,
// because that difference is the whole reason one of them is safe to fill in
// from your notes and the other is not.
function aboutCard(p, W) {
  const has = (p.about || "").trim(), wants = (p.guidance || "").trim();
  const body = t => `<div class="abody">${esc(t).replace(/\n/g, "<br>")}</div>`;

  if (!editAbout) return `
    <div class="about${has || wants ? "" : " empty"}">
      <div class="row" style="align-items:baseline">
        <h3>${W.aboutHead}</h3>
        <button class="link" id="aboutedit" style="margin-left:auto"
          >${has || wants ? "edit" : "add"}</button>
      </div>
      ${has ? body(has) : `<div class="dim">${W.aboutBlurb}</div>`}
      ${wants ? `<div class="wants"><h3>${W.wantsHead}</h3>${body(wants)}</div>` : ""}
    </div>`;

  return `
    <div class="about open">
      <div class="row" style="align-items:baseline"><h3>${W.aboutHead}</h3></div>
      <div class="dim" style="font-size:12.5px">Context. It changes what a brief
        picks out of your notes, never what those notes say.</div>
      <textarea id="abouttext" rows="4"
        placeholder="${esc(W.aboutHint)}">${esc(aboutDraft ?? p.about ?? "")}</textarea>

      <div class="wants">
        <h3>${W.wantsHead}</h3>
        <div class="dim" style="font-size:12.5px">An instruction to Claude. It
          decides shape, emphasis and what always gets called out — it cannot
          make a brief say anything your updates do not.</div>
        <textarea id="wantstext" rows="3"
          placeholder="${esc(W.wantsHint)}">${esc(p.guidance ?? "")}</textarea>
      </div>

      <div class="row" style="margin-top:10px">
        <button class="go" id="aboutsave">Save</button>
        <button class="link" id="aboutcancel">cancel</button>
        ${p.updates.length ? `<button class="link" id="aboutdraft"
          >draft the top one from my notes</button>` : ""}
        <span class="dim" style="margin-left:auto;font-size:13px"
          >saving rebuilds the briefs below</span>
      </div>
    </div>`;
}

async function projectPage(id, scope) {
  app.className = "wrap";
  const [p, { projects: all }] = await Promise.all([
    api(`/api/project?id=${encodeURIComponent(id)}`), api("/api/projects"),
  ]);
  if (pendingFor !== +id) { pendingLinks = []; pendingFor = +id; openAct = openKind = null;
                          editAbout = false; aboutDraft = null; }
  const others = all.filter(x => x.id !== +id);
  const othersById = Object.fromEntries(others.map(o => [o.id, o]));
  // A link you picked before the page reloaded, minus anything deleted since.
  const pending = pendingLinks.filter(x => others.some(o => o.id === x.id));
  const topics = p.topics;
  const byId = Object.fromEntries(topics.map(t => [t.id, t]));

              : u.topic_id ? `<span class="filed">${esc(byId[u.topic_id]?.name || "")}</span>` : ""}
            <button class="link danger" data-delupd="${u.id}">delete</button></div>
          <div class="body">${esc(u.body)}</div>
          <div class="lks" style="margin-top:7px">
            ${u.links.map(l => lkChip(l, u.id)).join("")}
            <select class="addlk" data-link="${u.id}"><option value="">+ link…</option>${
              others.filter(o => !u.links.some(l => l.id === o.id)).map(o =>
                `<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select>
          </div>
        </div>`).join("")
        : `<div class="empty">${tid
            ? `Nothing filed under <b>${esc(scopeName)}</b> yet. Add a ${W.unit} above,
               or re-file one from <a href="${href("")}">All</a>.`
            : unfiledView ? `Everything is filed.`
            : W.none}</div>`}
    </div></div>`;

  // The pane on the left, the page on the right — the same shape as home,
  // because it is the same question asked of one page instead of all of them.
  const shell = () => pagePane(p.pane || { items: [], updates: 0 }, p, W) + right();
  app.className = "wrap two";
  app.innerHTML = shell();

  const reload = () => route();
  // Opening an item's form rewrites the shell, so everything bound by id has
  // to be bound again — a dead Add button is worse than a slow one.
  const rerender = () => { app.innerHTML = shell(); wire(); };

  // ---- add an update, into the topic you are looking at
  const post = async () => {
    const body = $("#body").value.trim();
    if (!body) return $("#body").focus();
    const into = $("#into") ? $("#into").value : (tid ?? "");
    await busy($("#addupd"), "Saving", async () => {
      await api("/api/update", { project_id: p.id, body, topic_id: into || null,
                                 links: pending.map(x => x.id) });
      $("#body").value = "";
      toast(pending.length ? `Saved · also in ${pending.map(x => x.name).join(", ")}`
                           : "Saved");
      pendingLinks = [];
      await reload();
    });
  };
  function wire() {
    $("#addupd").onclick = post;
    $("#body").onkeydown = e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); post(); }
    };

    // ---- topics
    $("#addtopic").onclick = async () => {
      const name = prompt(`New topic in "${p.name}"`);
      if (!name || !name.trim()) return;
      try {
        const t = await api("/api/topic/new", { project_id: p.id, name });
        location.hash = href(t.id);          // land on it, ready to file
        toast(`Topic "${t.name}" added`);
      } catch (e) { toast(e.message, true); }
    };
    if ($("#rentopic")) $("#rentopic").onclick = async () => {
      const name = prompt("Rename topic", byId[tid].name);
      if (!name || name.trim() === byId[tid].name) return;
      try { await api("/api/topic/rename", { id: tid, name }); await reload(); }
      catch (e) { toast(e.message, true); }
    };
    if ($("#deltopic")) $("#deltopic").onclick = async () => {
      const n = byId[tid].updates;
      // Worth saying plainly: this is the one delete in the app that keeps what
      // it is deleting from. Nobody should hesitate over it.
      if (!confirm(`Delete the topic "${byId[tid].name}"?\n\n` +
          (n ? `Its ${n} ${W.unit}${n === 1 ? "" : "s"} are kept — they move to Unfiled.\n` : "") +
          `Only the topic and its cached summary go.`)) return;
      try {
        const r = await api("/api/topic/delete", { id: tid });
        location.hash = href("");
        toast(r.unfiled ? `Deleted · ${r.unfiled} ${W.unit}${r.unfiled === 1 ? "" : "s"} moved to Unfiled`
                        : "Topic deleted");
      } catch (e) { toast(e.message, true); }
    };

    // ---- claude, scoped
    if ($("#sumbtn")) $("#sumbtn").onclick = e => busy(e.target, "Reading updates", async () => {
      await api("/api/summarize", { project_id: p.id, topic_id: tid });
      await reload();
      toast("Summary updated");
    });
    const ask = async () => {
      const question = $("#q").value.trim();
      if (!question) return $("#q").focus();
      await busy($("#askbtn"), "Thinking", async () => {
        await api("/api/ask", { project_id: p.id, topic_id: tid, question });
        $("#q").value = "";
        await reload();
      });
    };
    if ($("#askbtn")) {
      $("#askbtn").onclick = ask;
      $("#q").onkeydown = e => { if (e.key === "Enter") ask(); };
    }

    // ---- project rename / delete
    $("#rename").onclick = async () => {
      const name = prompt(person ? "Rename person" : "Rename project", p.name);
      if (!name || name.trim() === p.name) return;
      try { await api("/api/project/rename", { id: p.id, name }); await reload(); }
      catch (e) { toast(e.message, true); }
    };
    $("#delproj").onclick = async () => {
      // The updates go with it and there is no undo, so the name has to be typed.
      const typed = prompt(
        `Delete "${p.name}" and all ${p.updates.length} of ${person ? "your notes" : "its updates"}?\n` +
        `This cannot be undone. Type the ${person ? "person's" : "project"} name to confirm.`);
      if (typed !== p.name) return typed !== null && toast("Name did not match — nothing deleted", true);
      try {
        await api("/api/project/delete", { id: p.id });
        location.hash = "#/";
        toast("Deleted");
      } catch (e) { toast(e.message, true); }
    };

    // ---- suggest links for text you have not saved yet
    //
    // A plain substring match against names you created, offered as a button.
    // No Claude call: this fires on every keystroke, and a suggestion you have
    // to wait ten seconds for is not a suggestion. Nothing is linked until you
    // press it, so a false match costs one glance.
    const suggest = () => {
      const hit = mentions($("#body").value, others, p.id, pending.map(x => x.id));
      $("#sug").innerHTML = hit.length
        ? `<span>mentions</span>` + hit.map(o =>
            `<button class="link" data-pend="${o.id}">${esc(o.name)} — link?</button>`).join("")
        : "";
    };
    $("#body").oninput = suggest;
    suggest();

    // ---- who this page is to you
    if ($("#aboutedit")) $("#aboutedit").onclick = () => {
      editAbout = true; aboutDraft = null; rerender();
      const t = $("#abouttext"); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
    };
    if ($("#aboutcancel")) $("#aboutcancel").onclick = () => {
      editAbout = false; aboutDraft = null; rerender();
    };
    if ($("#aboutdraft")) $("#aboutdraft").onclick = e =>
      busy(e.target, "Reading", async () => {
        const r = await api("/api/about/draft", { project_id: p.id });
        // Into the box, never into the store. Nothing is saved until you press
        // Save, because this text is what every brief below is written against.
        aboutDraft = r.about;
        rerender();
        toast("Draft — edit it, then Save");
      });
    if ($("#aboutsave")) $("#aboutsave").onclick = e => {
      // Read both boxes before the await: reload() replaces the DOM.
      const about = $("#abouttext").value, guidance = $("#wantstext").value;
      busy(e.target, "Saving", async () => {
        const r = await api("/api/about", { project_id: p.id, about, guidance });
        editAbout = false; aboutDraft = null;
        await reload();
        // The briefs are gone rather than flagged: they were written for
        // whoever this page used to be, or to a different brief, and neither
        // is visible on the page.
        toast(!r.cleared.length ? "No change"
              : (about.trim() || guidance.trim())
                ? "Saved · briefs cleared, rebuild when you want them"
                : "Cleared");
      });
    };

    // ---- prepare for the next meeting
    if ($("#prepbtn")) $("#prepbtn").onclick = e =>
      busy(e.target, "Reading", async () => {
        await api("/api/prep", { project_id: p.id,
                                 since: $("#prepsince") ? $("#prepsince").value : "" });
        await reload();
        toast("Prep ready");
      });

    // ---- build this page's own pane
    if ($("#panebtn")) $("#panebtn").onclick = e =>
      busy(e.target, "Reading", async () => {
        openAct = openKind = null;
        await api("/api/page/refresh", { project_id: p.id });
        await reload();
        toast("Dates updated");
      });
    if ($("#actnote")) $("#actnote").focus();
  }
  wire();

  // ---- re-file an update, or link one somewhere else
  app.onchange = async e => {
    const add = e.target.closest("[data-link]");
    if (add && add.value) {
      add.disabled = true;
      try {
        await api("/api/update/link",
                  { id: +add.dataset.link, project_id: +add.value, on: true });
        toast(`Also in ${othersById[+add.value].name}`);
      } catch (err) { toast(err.message, true); }
      return reload();
    }
    const pend = e.target.closest("#pendadd");
    if (pend && pend.value) {
      const draft = $("#body").value;
      pending.push(othersById[+pend.value]);
      pendingLinks = pending.slice();
      await reload();
      $("#body").value = draft;               // keep what you were typing
      $("#body").focus();
      return;
    }
    const sel = e.target.closest("[data-move]");
    if (!sel) return;
    sel.disabled = true;
    try {
      await api("/api/update/move", { id: +sel.dataset.move, topic_id: sel.value || null });
      toast(sel.value ? `Filed under ${byId[+sel.value].name}` : "Unfiled");
    } catch (err) { toast(err.message, true); }
    await reload();
  };

  app.onclick = async e => {
    // ---- act on a pane item. Every action writes an update on this page, and
    // that update is the record — nothing here sets a status.
    const more = e.target.closest("[data-more]");
    if (more) { showAll[more.dataset.more] = !showAll[more.dataset.more]; return rerender(); }
    const act = e.target.closest("[data-act]");
    if (act) {
      const i = +act.dataset.i;
      const same = openAct === i && openKind === act.dataset.act;
      openAct = same ? null : i;
      openKind = same ? null : act.dataset.act;
      return rerender();
    }
    if (e.target.id === "actcancel") { openAct = openKind = null; return rerender(); }
    if (e.target.id === "actgo") {
      const i = openAct, kind = openKind;
      const note = $("#actnote") ? $("#actnote").value.trim() : "";
      const date = $("#actdate") ? $("#actdate").value : "";
      return busy(e.target, "Logging", async () => {
        await api("/api/page/act", { project_id: p.id, built: p.pane.created_at,
                                     index: i, action: kind, note, date });
        openAct = openKind = null;
        await reload();
        toast(`Logged to ${p.name}`);
      });
    }

    const u = e.target.closest("[data-delupd]");
    const a = e.target.closest("[data-delans]");
    const un = e.target.closest("[data-unlink]");
    const off = e.target.closest("[data-unpend]");
    const on = e.target.closest("[data-pend]");
    if (off || on) {
      const draft = $("#body").value;
      pendingLinks = off ? pending.filter(x => x.id !== +off.dataset.unpend)
                         : pending.concat([othersById[+on.dataset.pend]]);
      await reload();
      $("#body").value = draft;
      return $("#body").focus();
    }
    try {
      if (un) {
        // Unlinking from the guest's own row means "not here"; from a chip on
        // one of our updates it means "not there". Both are the same call,
        // and neither touches a word of the update itself.
        await api("/api/update/link",
                  { id: +un.dataset.unlink, project_id: +un.dataset.pid, on: false });
        toast("Unlinked");
        await reload();
      }
      else if (u) { await api("/api/update/delete", { id: +u.dataset.delupd }); await reload(); }
      else if (a) { await api("/api/answer/delete", { id: +a.dataset.delans }); await reload(); }
    } catch (err) { toast(err.message, true); }
  };
}

/* ----------------------------------------------------------- routing ---- */
async function route() {
  app.onclick = null; app.onchange = null; app.className = "wrap";
  const m = location.hash.match(/^#\/p\/(\d+)(?:\/t\/(\d+)|\/(unfiled))?/);
  try {
    if (m) await projectPage(m[1], m[2] || m[3] || "");
    else await home(/^#\/people\b/.test(location.hash) ? "person" : "project");
  } catch (e) {
    app.innerHTML = `<div class="head"><a href="#/" class="dim"
      style="text-decoration:none">← all projects</a></div>
      <div class="empty err">${esc(e.message)}</div>`;
  }
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
